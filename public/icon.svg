<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Tower Linear Gradient -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Subtle Outer Neon Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Rising Sun Over Horizon -->
  <circle cx="256" cy="235" r="92" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Horizon Light Beam -->
  <ellipse cx="256" cy="275" rx="180" ry="12" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>

  <!-- Background Silhouette Mountain Peaks -->
  <polygon points="60,330 140,240 210,330" fill="#091428" opacity="0.9"/>
  <polygon points="300,330 380,230 460,330" fill="#091428" opacity="0.9"/>

  <!-- Twin Futuristic Gemini Towers (Left & Right Spire) -->
  <!-- Left Spire -->
  <polygon points="175,130 195,150 195,340 155,340 155,150" fill="url(#towerGrad)"/>
  <polygon points="175,100 175,130 177,130 177,100" fill="#38bdf8"/>
  <line x1="175" y1="140" x2="175" y2="330" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <!-- Left Tower Window Grid -->
  <line x1="162" y1="180" x2="188" y2="180" stroke="#fde047" stroke-width="2" opacity="0.7"/>
  <line x1="162" y1="210" x2="188" y2="210" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <line x1="162" y1="240" x2="188" y2="240" stroke="#fde047" stroke-width="2" opacity="0.7"/>
  <line x1="162" y1="270" x2="188" y2="270" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <line x1="162" y1="300" x2="188" y2="300" stroke="#fde047" stroke-width="2" opacity="0.7"/>

  <!-- Right Spire -->
  <polygon points="337,130 357,150 357,340 317,340 317,150" fill="url(#towerGrad)"/>
  <polygon points="337,100 337,130 339,130 339,100" fill="#fbbf24"/>
  <line x1="337" y1="140" x2="337" y2="330" stroke="#fbbf24" stroke-width="2.5" opacity="0.8"/>
  <!-- Right Tower Window Grid -->
  <line x1="324" y1="180" x2="350" y2="180" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <line x1="324" y1="210" x2="350" y2="210" stroke="#fde047" stroke-width="2" opacity="0.7"/>
  <line x1="324" y1="240" x2="350" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <line x1="324" y1="270" x2="350" y2="270" stroke="#fde047" stroke-width="2" opacity="0.7"/>
  <line x1="324" y1="300" x2="350" y2="300" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

  <!-- Center Sky-Bridge Connecting the Towers -->
  <rect x="195" y="215" width="122" height="14" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="222" x2="312" y2="222" stroke="#fde047" stroke-width="2"/>

  <!-- Center Core Pyramid / Citadel Landmark -->
  <polygon points="256,170 286,280 226,280" fill="url(#amberGrad)" opacity="0.95"/>
  <polygon points="256,170 256,280 286,280" fill="#f59e0b" opacity="0.5"/>
  <line x1="256" y1="150" x2="256" y2="170" stroke="#fef08a" stroke-width="3" filter="url(#glow)"/>

  <!-- Golden Horizon Bridge Arch Arc Across Bottom -->
  <path d="M 80,345 Q 256,310 432,345" fill="none" stroke="#fbbf24" stroke-width="6" filter="url(#glow)"/>
  <path d="M 90,358 Q 256,325 422,358" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="160" y1="334" x2="160" y2="352" stroke="#fbbf24" stroke-width="2"/>
  <line x1="220" y1="320" x2="220" y2="340" stroke="#38bdf8" stroke-width="2"/>
  <line x1="256" y1="316" x2="256" y2="338" stroke="#fef08a" stroke-width="3"/>
  <line x1="292" y1="320" x2="292" y2="340" stroke="#38bdf8" stroke-width="2"/>
  <line x1="352" y1="334" x2="352" y2="352" stroke="#fbbf24" stroke-width="2"/>

  <!-- Coastal Ocean Shoreline Waves -->
  <path d="M 40,370 C 140,355 180,375 256,365 C 330,355 380,375 472,370 L 472,420 L 40,420 Z" fill="#0369a1" opacity="0.35"/>
  <path d="M 40,385 C 120,375 190,392 256,380 C 330,370 400,390 472,382 L 472,430 L 40,430 Z" fill="#0284c7" opacity="0.45"/>

  <!-- App Title Banner Plaque -->
  <g transform="translate(0, 395)">
    <rect x="76" y="5" width="360" height="52" rx="14" fill="#020617" stroke="#fbbf24" stroke-width="2.5" opacity="0.96" filter="url(#glow)"/>
    <text x="256" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" fill="#ffffff" letter-spacing="4" text-anchor="middle">
      <tspan fill="#fbbf24">GEMINI</tspan> <tspan fill="#38bdf8">CITY</tspan>
    </text>
  </g>
</svg>
